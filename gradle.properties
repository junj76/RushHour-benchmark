# The Kotlin compiler daemon can hang while establishing IPC in this WSL setup.
# Run the compiler inside the Gradle process instead.
kotlin.compiler.execution.strategy=in-process

# 项目位于中文路径下时，Java 18+ 的 Gradle 会用 UTF-8 写测试 worker 的 @argfile，
# 而 worker 按系统编码（中文 Windows = GBK）读取该文件，导致 ClassNotFoundException。
# COMPAT 让 daemon 用系统原生编码写 argfile，与 worker 的读取编码保持一致。
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=COMPAT
